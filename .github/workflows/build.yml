name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build CampusCat.app
        run: ./scripts/build_app.sh

      - name: Check the app starts
        run: |
          # Launch the real binary for a few seconds; fail if it crashes on startup.
          build/CampusCat.app/Contents/MacOS/CampusCat &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            wait "$PID" || true
            echo "CampusCat exited during startup"
            exit 1
          fi
          kill "$PID"
          echo "CampusCat was still running after 5 seconds"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: CampusCat
          path: build/CampusCat.zip

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/CampusCat.zip \
            --title "Campus Cat (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download CampusCat.zip below. See the README for the first-launch steps." \
            --target "$GITHUB_SHA"
