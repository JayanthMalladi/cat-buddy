name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: ./scripts/build_app.sh

      - name: Check the app starts, then hover, drag, watch a walk and screenshot it
        run: |
          # Walk every 150 s instead of 5 min so the check can see one.
          defaults write com.campuscat.buddy walkEverySeconds -float 150
          # Launch the real binary; fail if it crashes on startup.
          "build/Vrinda's Cat.app/Contents/MacOS/CampusCat" &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            wait "$PID" || true
            echo "CampusCat exited during startup"
            exit 1
          fi
          echo "CampusCat was still running after 5 seconds"
          swift tools/ui_check.swift "$PID" build/screenshots
          kill -0 "$PID" || { echo "CampusCat crashed during the UI check"; exit 1; }
          kill "$PID"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: VrindasCat
          path: build/VrindasCat.zip

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/VrindasCat.zip \
            --title "Vrinda's Cat (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download VrindasCat.zip below. See the README for the first-launch steps." \
            --target "$GITHUB_SHA"
